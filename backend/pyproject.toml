[project]
name = "reel"
version = "0.1.0"
description = "Product films, directed by AI: learn a style from reference videos, write the story, render the film."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "numpy>=2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "yt-dlp>=2025.1.1",
]

[project.scripts]
reel = "reel.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]  # B008: FastAPI declares uploads as File(...) defaults
